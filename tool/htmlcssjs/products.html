<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>商品管理 · Ray</title><link rel="stylesheet" href="site.css"></head>
<body data-page="products"><div class="app" data-shell></div><template data-content><main class="page">
  <header class="page-head reveal"><div><p class="eyebrow">PRODUCT CATALOG</p><h1>商品管理</h1><p>分类、菜品和套餐统一使用 product:read / product:manage 权限。</p></div><button class="primary" data-demo="设计演示：按当前标签调用分类、菜品或套餐新增接口。">新增商品</button></header>
  <div class="api-strip reveal"><span class="api-code">GET /api/merchant/v1/category/page</span><span class="api-code">GET /api/merchant/v1/dish/page</span><span class="api-code">GET /api/merchant/v1/setmeal/page</span><span class="api-code write">POST / status / PUT / DELETE</span></div>
  <section class="panel reveal" style="padding:18px"><div class="toolbar" data-tabs><button class="active" data-tab="dish">菜品 42</button><button data-tab="setmeal">套餐 8</button><button data-tab="category">分类 12</button><input class="search" style="margin-left:auto;max-width:260px;height:40px" placeholder="搜索名称"></div>
    <div data-tab-panel="dish" class="product-grid"><article class="product-card panel"><span class="tag ok">起售</span><h3>毛血旺</h3><p class="muted">招牌热菜 · 中辣/特辣</p><footer><strong>¥88.00</strong><button data-demo="设计演示：打开菜品详情与编辑。">编辑</button></footer></article><article class="product-card panel"><span class="tag ok">起售</span><h3>宫保鸡丁</h3><p class="muted">招牌热菜 · 标准份</p><footer><strong>¥42.00</strong><button data-demo="设计演示：打开菜品详情与编辑。">编辑</button></footer></article><article class="product-card panel"><span class="tag warn">停售</span><h3>时令笋尖</h3><p class="muted">时令蔬菜 · 库存不足</p><footer><strong>¥36.00</strong><button data-demo="设计演示：POST /api/merchant/v1/dish/status。">设为起售</button></footer></article></div>
    <div data-tab-panel="setmeal" class="product-grid" hidden><article class="product-card panel"><span class="tag ok">起售</span><h3>双人招牌套餐</h3><p class="muted">毛血旺 + 宫保鸡丁 + 米饭</p><footer><strong>¥128.00</strong><button data-demo="设计演示：GET /api/merchant/v1/setmeal/{id}。">查看</button></footer></article><article class="product-card panel"><span class="tag warn">停售</span><h3>工作日午市套餐</h3><p class="muted">套餐菜品关联发生变化</p><footer><strong>¥58.00</strong><button data-demo="设计演示：编辑套餐菜品。">编辑</button></footer></article></div>
    <div data-tab-panel="category" class="endpoint-list" hidden><div class="endpoint-row"><strong>招牌热菜</strong><span class="muted">菜品分类 · 排序 1</span><button data-demo="设计演示：修改分类。">编辑</button></div><div class="endpoint-row"><strong>双人套餐</strong><span class="muted">套餐分类 · 排序 2</span><button data-demo="设计演示：修改分类。">编辑</button></div></div>
  </section>
</main></template><script src="site.js"></script></body></html>
