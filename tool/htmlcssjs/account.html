<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>账号与会话安全 · Ray</title><link rel="stylesheet" href="site.css"></head>
<body data-page="account"><div class="app" data-shell></div><template data-content><main class="page">
  <header class="page-head reveal"><div><p class="eyebrow">SESSION SECURITY</p><h1>账号与会话安全</h1><p>会话信息来自服务端，密码修改成功后旧 Token 失效。</p></div><a class="button" href="index.html">返回岗位首页</a></header>
  <div class="detail-layout"><section class="panel detail-main reveal"><p class="eyebrow">GET /api/merchant/v1/session/me</p><h2>当前会话</h2><div class="detail-meta"><div><span>员工</span><strong>陈晨 · #8</strong></div><div><span>租户</span><strong>ray-demo</strong></div><div><span>当前门店</span><strong>总店</strong></div><div><span>建议工作台</span><strong>OPERATIONS</strong></div></div><h3>岗位与权限摘要</h3><div class="api-strip"><span class="api-code compat">CASHIER</span><span class="api-code">bill:create</span><span class="api-code">bill:checkout</span><span class="api-code">dining-table:clear</span><span class="api-code">pickup-order:collect</span></div><p class="action-hint">角色、权限或门店授权变化后，下一次请求立即按服务端最新授权执行。</p></section>
    <aside class="panel action-panel reveal"><p class="eyebrow">PUT /api/merchant/v1/session/password</p><h2>修改本人密码</h2><form onsubmit="event.preventDefault();document.querySelector('[data-password-result]').hidden=false"><div class="field"><label for="old-password">当前密码</label><input id="old-password" type="password" required></div><div class="field"><label for="new-password">新密码</label><input id="new-password" type="password" minlength="6" required></div><div class="field"><label for="confirm-password">确认新密码</label><input id="confirm-password" type="password" minlength="6" required></div><button class="primary" style="width:100%" type="submit">更新密码</button></form><div class="demo-note" data-password-result hidden style="margin-top:16px">设计演示：密码更新成功，旧 Token 已失效，应返回登录页。</div><hr style="border:0;border-top:1px solid var(--border);margin:22px 0"><button class="danger" style="width:100%" data-demo="设计演示：POST /api/merchant/v1/employee/logout 并清理本地 Token。">退出当前会话</button></aside></div>
</main></template><script src="site.js"></script></body></html>
