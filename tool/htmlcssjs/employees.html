<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>员工角色与门店 · Ray</title><link rel="stylesheet" href="site.css"></head>
<body data-page="employees"><div class="app" data-shell></div><template data-content><main class="page">
  <header class="page-head reveal"><div><p class="eyebrow">ACCESS CONTROL</p><h1>员工角色与门店</h1><p>账号、五类系统岗位、权限目录与门店授权一体化配置。</p></div><button class="primary" data-demo="设计演示：POST /api/merchant/v1/employee 创建后继续分配角色和门店。">新增员工</button></header>
  <div class="api-strip reveal"><span class="api-code">GET /api/merchant/v1/rbac/permissions</span><span class="api-code">GET/PUT employee roles</span><span class="api-code">GET/PUT employee stores</span><span class="api-code write">POST /api/merchant/v1/employee/status</span></div>
  <div class="form-grid"><aside class="panel employee-list reveal"><div class="field"><input aria-label="搜索员工" placeholder="搜索员工"></div><div class="employee-card active"><strong>陈晨</strong><p class="muted">前台 / 收银员 · 总店</p></div><div class="employee-card"><strong>周师傅</strong><p class="muted">后厨 · 总店</p></div><div class="employee-card"><strong>林经理</strong><p class="muted">门店经理 · 2 家门店</p></div></aside>
    <section class="panel employee-form reveal"><p class="eyebrow">EMPLOYEE PROFILE</p><h2>陈晨</h2><div class="field"><label for="name">员工姓名</label><input id="name" value="陈晨"></div><div class="field"><label for="phone">手机号</label><input id="phone" value="138****1208"></div>
      <h3>岗位角色</h3><div class="check-grid"><label class="check"><input type="checkbox" checked> CASHIER · 前台/收银员</label><label class="check"><input type="checkbox"> WAITER · 服务员</label><label class="check"><input type="checkbox"> KITCHEN · 后厨</label><label class="check"><input type="checkbox" disabled> TENANT_OWNER · 不可越级授予</label></div>
      <h3>授权门店</h3><div class="check-grid"><label class="check"><input type="checkbox" checked> Ray 现代中餐厅 · 总店（默认）</label><label class="check"><input type="checkbox"> Ray 现代中餐厅 · 西湖店</label></div>
      <div class="demo-note" style="margin-top:20px">停用、移除负责人角色或撤销门店授权都会刷新会话版本；最后一个有效负责人受保护。</div><button class="primary" data-demo="设计演示：依次覆盖员工角色与门店授权。">保存配置</button>
    </section>
  </div>
  <section class="panel reveal" style="padding:22px;margin-top:18px"><div class="section-title"><div><p class="eyebrow">FIXED PERMISSION CATALOG</p><h2>权限目录预览</h2></div><span class="tag">系统角色只读</span></div><div class="permission-groups"><article class="permission-group"><h4>统一账单</h4><code>bill:read</code><code>bill:create</code><code>bill:quote</code><code>bill:confirm</code><code>bill:checkout</code></article><article class="permission-group"><h4>堂食与前厅</h4><code>dining-table:open</code><code>dining-table:clear</code><code>dine-in-order:add-item</code><code>serve-task:confirm</code></article><article class="permission-group"><h4>后厨</h4><code>kitchen-item:read</code><code>kitchen-item:start</code><code>kitchen-item:ready</code></article><article class="permission-group"><h4>商品</h4><code>product:read</code><code>product:manage</code></article><article class="permission-group"><h4>员工与角色</h4><code>employee:read</code><code>employee:manage</code><code>rbac:manage</code></article><article class="permission-group"><h4>旧自取兼容</h4><code>pickup-order:read</code><code>pickup-order:ready</code><code>pickup-order:collect</code></article></div></section>
</main></template><script src="site.js"></script></body></html>
