<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>员工登录 · Ray</title><link rel="stylesheet" href="site.css"></head>
<body data-page="login"><main class="login">
  <section class="login-hero"><a class="login-brand" href="index.html"><span class="brand-mark">R</span><strong>RAY 运营台</strong></a><p class="eyebrow reveal">RESTAURANT OPERATIONS</p><h1 class="reveal">让每一份出餐<br>都有秩序。</h1><p class="muted reveal" style="color:#b9c6d0">订单、菜品与运营任务，在一个岗位工作台完成闭环。</p></section>
  <section class="login-panel"><form class="login-box reveal" onsubmit="event.preventDefault();location.href='index.html'"><p class="eyebrow">EMPLOYEE ACCESS</p><h2>员工登录</h2><p class="muted">使用租户编码、用户名和密码进入运营台</p><div class="field"><label for="tenant">租户编码</label><input id="tenant" value="ray-demo" required maxlength="32"></div><div class="field"><label for="username">用户名</label><input id="username" value="chenchen" autocomplete="username" required></div><div class="field"><label for="password">密码</label><input id="password" value="123456" type="password" autocomplete="current-password" required></div><button class="primary" type="submit">进入运营台</button><div class="api-strip"><span class="api-code write">POST /admin/employee/login</span><span class="api-code">GET /admin/session/me</span></div><p class="demo-note" style="margin-top:20px">本实验室不连接认证接口；提交仅演示“登录后初始化会话”。</p><p><a href="tokens.html">设计系统</a> · <a href="states.html">异常状态</a></p></form></section>
</main><script src="site.js"></script></body></html>
