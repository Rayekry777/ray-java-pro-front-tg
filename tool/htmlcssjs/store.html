<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>门店营业设置 · Ray</title><link rel="stylesheet" href="site.css"></head>
<body data-page="store"><div class="app" data-shell></div><template data-content><main class="page">
  <header class="page-head reveal"><div><p class="eyebrow">STORE BUSINESS</p><h1>门店营业设置</h1><p>当前门店：Ray 现代中餐厅 · 总店</p></div><span class="tag ok">营业中</span></header>
  <div class="api-strip reveal"><span class="api-code">GET /admin/shop/status</span><span class="api-code">GET /admin/shop/business-settings</span><span class="api-code write">PUT /admin/shop/{status}</span><span class="api-code write">PUT /admin/shop/mode/{mode}</span><span class="api-code write">PUT /admin/shop/business-hours</span></div>
  <section class="panel reveal" style="padding:22px"><div class="section-title"><div><p class="eyebrow">BUSINESS MODE</p><h2>营业控制模式</h2></div></div><div class="mode-grid"><article class="mode-card selected"><span class="tag">AUTO</span><h3>按时段自动营业</h3><p class="muted">根据下方周营业时段自动切换。</p></article><article class="mode-card"><span class="tag ok">MANUAL_OPEN</span><h3>手动营业</h3><p class="muted">忽略时段，保持接单。</p></article><article class="mode-card"><span class="tag warn">MANUAL_CLOSED</span><h3>手动打烊</h3><p class="muted">立即停止新订单进入。</p></article></div></section>
  <section class="panel reveal" style="padding:22px;margin-top:18px"><div class="section-title"><div><p class="eyebrow">WEEKLY SCHEDULE</p><h2>周营业时段</h2></div><button data-demo="设计演示：新增同日营业时段。">添加时段</button></div><div class="schedule-grid"><div class="schedule-row"><strong>星期一</strong><label><input type="checkbox" checked> 启用</label><span>10:30–14:00 · 16:30–22:00</span><button>编辑</button></div><div class="schedule-row"><strong>星期二</strong><label><input type="checkbox" checked> 启用</label><span>10:30–14:00 · 16:30–22:00</span><button>编辑</button></div><div class="schedule-row"><strong>星期三</strong><label><input type="checkbox"> 休息</label><span class="muted">不营业</span><button>编辑</button></div><div class="schedule-row"><strong>星期五</strong><label><input type="checkbox" checked> 启用</label><span>10:30–次日 00:30</span><button>编辑</button></div></div><div class="dialog-actions"><button>取消修改</button><button class="primary" data-demo="设计演示：PUT /admin/shop/business-hours。">保存营业设置</button></div></section>
</main></template><script src="site.js"></script></body></html>
