<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>统一账单详情 · Ray</title><link rel="stylesheet" href="site.css"></head>
<body data-page="bills"><div class="app" data-shell></div><template data-content><main class="page">
  <header class="page-head reveal"><div><p class="eyebrow">BILL · BI202607300128</p><h1>统一账单详情</h1><p>下一动作同时受服务端 allowedActions、账单状态和岗位权限约束。</p></div><a class="button" href="bills.html">← 返回账单中心</a></header>
  <div class="demo-note reveal">本页为接口预留设计，不连接 API。可切换堂食、现场外带和历史只读三种响应场景。</div>
  <div class="segment reveal"><button class="active" data-bill-scenario="dine">堂食 · 待清台</button><button data-bill-scenario="takeout">外带 · 待交付</button><button data-bill-scenario="legacy">历史账单 · 只读</button></div>

  <section data-scenario-panel="dine">
    <div class="status-rail reveal"><div class="status-step done">✓ 已确认</div><div class="status-step done">✓ 制作完成</div><div class="status-step done">✓ 已上桌</div><div class="status-step done">✓ 已支付</div><div class="status-step current">待清台</div></div>
    <div class="detail-layout">
      <article class="panel detail-main reveal"><div class="detail-meta"><div><span>服务方式</span><strong>DINE_IN · A08</strong></div><div><span>来源</span><strong>MERCHANT_WEB</strong></div><div><span>就餐人数</span><strong>3 人</strong></div><div><span>版本</span><strong>version 7</strong></div></div>
        <div class="api-strip"><span class="api-code">GET /admin/bills/{id}</span><span class="api-code">allowedActions</span></div>
        <table><thead><tr><th>商品</th><th>数量</th><th>制作状态</th><th>单价</th><th>金额</th></tr></thead><tbody><tr><td>毛血旺 · 中辣</td><td>1</td><td><span class="tag ok">SERVED</span></td><td>¥88</td><td>¥88</td></tr><tr><td>宫保鸡丁</td><td>1</td><td><span class="tag ok">SERVED</span></td><td>¥42</td><td>¥42</td></tr><tr><td>米饭</td><td>2</td><td><span class="tag ok">SERVED</span></td><td>¥3</td><td>¥6</td></tr></tbody></table>
      </article>
      <aside class="panel action-panel reveal"><p class="eyebrow">SERVER ALLOWED ACTIONS</p><h2>下一动作</h2><div class="api-strip"><span class="api-code compat">dining-table:clear</span></div><div class="money-row"><span>应付</span><strong>¥136.00</strong></div><div class="money-row"><span>支付状态</span><strong class="tag ok">PAID</strong></div><div class="action-stack"><button class="primary" data-demo="设计演示：POST /admin/bills/{id}/clear-table，成功后释放桌台。">确认清台</button><button disabled>收款（已完成）</button><button disabled>取消（状态不允许）</button></div><p class="action-hint">按钮不根据前端猜测展示，只消费响应中的 allowedActions。</p></aside>
    </div>
  </section>

  <section data-scenario-panel="takeout" hidden>
    <div class="status-rail reveal"><div class="status-step done">✓ 已确认</div><div class="status-step done">✓ 已下厨</div><div class="status-step done">✓ 制作完成</div><div class="status-step done">✓ 已支付</div><div class="status-step current">待交付</div></div>
    <div class="detail-layout"><article class="panel detail-main reveal"><div class="detail-meta"><div><span>服务方式</span><strong>TAKEOUT</strong></div><div><span>识别</span><strong>现场流水 016</strong></div><div><span>打包</span><strong>2 份</strong></div><div><span>来源</span><strong>MERCHANT_WEB</strong></div></div><div class="api-strip"><span class="api-code">GET /admin/bills/{id}</span><span class="api-code write">PUT /admin/bills/{id}/handover</span></div><div class="readonly-banner">现场外带不要求顾客账号、手机号或预约取餐时间。</div></article><aside class="panel action-panel reveal"><p class="eyebrow">HANDOVER</p><h2>核对小票后交付</h2><p class="muted">制作已完成且支付成功，允许确认交付。</p><div class="action-stack"><button class="primary" data-demo="设计演示：PUT /admin/bills/{id}/handover。">确认交付</button><button disabled>清台（不适用）</button></div></aside></div>
  </section>

  <section data-scenario-panel="legacy" hidden>
    <div class="readonly-banner reveal">历史来源 LEGACY_PICKUP · 通过只读门面展示 · allowedActions 为空</div>
    <div class="detail-layout" style="margin-top:20px"><article class="panel detail-main reveal"><div class="detail-meta"><div><span>来源类型</span><strong>LEGACY_PICKUP</strong></div><div><span>旧主键</span><strong>sourceId 126</strong></div><div><span>展示语义</span><strong>PICKUP</strong></div><div><span>旧履约</span><strong>TAKEAWAY</strong></div></div><div class="api-strip"><span class="api-code compat">GET /admin/bills/legacy/{sourceType}/{sourceId}</span></div><p class="muted">历史 DELIVERY 也只读展示，不提供新的配送操作。</p></article><aside class="panel action-panel reveal"><p class="eyebrow">READ ONLY</p><h2>无可执行动作</h2><button disabled>历史账单不可修改</button><p class="action-hint">如需处理旧自取任务，返回兼容 `/admin/order/**` 工作区。</p></aside></div>
  </section>
</main></template><script src="site.js"></script></body></html>
